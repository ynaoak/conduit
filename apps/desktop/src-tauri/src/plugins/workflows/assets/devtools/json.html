<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-i18n="json_title">JSON 整形 / 圧縮</title>
<script>
// The launcher passes its theme mode as ?theme=dark|light|system —
// tool windows have no IPC, so the URL is the sync channel. "system"
// (or no param, e.g. opened from a file) follows the OS live.
(() => {
  const theme = new URLSearchParams(location.search).get("theme");
  const media = matchMedia("(prefers-color-scheme: light)");
  const apply = () => {
    const light = theme === "light" || (theme !== "dark" && media.matches);
    document.documentElement.dataset.theme = light ? "light" : "dark";
  };
  apply();
  media.addEventListener("change", apply);
})();
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    /* the launcher injects --conduit-* (tool_window.rs); the literals are
       the fallback for running this file outside conduit */
    --surface: var(--conduit-surface, #0b0a0d);
    --surface-container: var(--conduit-surface-container, #151318);
    --surface-high: var(--conduit-surface-high, #1e1b24);
    --on-surface: var(--conduit-on-surface, #ece9f1);
    --on-variant: var(--conduit-on-variant, #9d97a8);
    --primary: var(--conduit-primary, #a678ff);
    --outline: var(--conduit-outline, #2c2933);
    --on-primary: #241148; --error: #f2b8b5;
  }
  /* light palette, applied by the theme script below */
  :root[data-theme="light"] {
    --surface: var(--conduit-surface, #faf8f5);
    --surface-container: var(--conduit-surface-container, #f1eeea);
    --surface-high: var(--conduit-surface-high, #e9e6e1);
    --on-surface: var(--conduit-on-surface, #1f1e1b);
    --on-variant: var(--conduit-on-variant, #4a4741);
    --primary: var(--conduit-primary, #8038f8);
    --outline: var(--conduit-outline, #d5d1ca);
    --on-primary: #ffffff; --error: #b3261e;
  }
  body {
    background: var(--surface); color: var(--on-surface); height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", Roboto,
      "Noto Sans JP", "Segoe UI", sans-serif; font-size: 14px;
    display: flex; flex-direction: column; gap: 12px; padding: 16px;
    /* the window is clipped by the injected chrome, and can now be
       resized smaller than this page: what does not fit has to scroll */
    overflow-y: auto; overflow-x: hidden;
  }
  h1 { font-size: 16px; font-weight: 500; }
  label { font-size: 12px; color: var(--on-variant); display: block; margin-bottom: 4px; }
  .grow { flex: 1; display: flex; flex-direction: column; }
  textarea {
    width: 100%; flex: 1; min-height: 90px; resize: none;
    background: var(--surface-container); color: var(--on-surface);
    border: 1px solid var(--outline); border-radius: 12px; padding: 10px 12px;
    font: 13px/1.5 Consolas, "Cascadia Mono", monospace; outline: none;
    tab-size: 2;
  }
  textarea:focus { border-color: var(--primary); }
  /* A monospace placeholder in the same font as the content reads as
     content — which is how an empty box ends up looking filled in.
     Italic separates them at a glance; the content is never italic. */
  textarea::placeholder, input::placeholder {
    color: var(--on-variant); opacity: 0.7; font-style: italic;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button {
    border: none; border-radius: 999px; padding: 8px 18px; font-size: 13px;
    background: var(--surface-high); color: var(--on-surface); cursor: pointer;
  }
  button.filled { background: var(--primary); color: var(--on-primary); font-weight: 500; }
  button:hover { filter: brightness(1.12); }
  #status { font-size: 12px; color: var(--on-variant); min-height: 1.2em; }
  #status.error { color: var(--error); }
</style>
</head>
<body>
  <h1 data-i18n="json_title">JSON 整形 / 圧縮</h1>
  <div class="grow">
    <label for="input" data-i18n="json_input">入力</label>
    <textarea id="input" placeholder='{"a":1,"b":[1,2]}' spellcheck="false"></textarea>
  </div>
  <div class="row">
    <button class="filled" id="pretty" data-i18n="json_pretty">↓ 整形（2 スペース）</button>
    <button class="filled" id="minify" data-i18n="json_minify">↓ 1 行に圧縮</button>
    <span style="flex:1"></span>
    <button id="copy-input" data-i18n="json_copy_input">入力をコピー</button>
    <button id="copy-output" data-i18n="json_copy_result">結果をコピー</button>
  </div>
  <div class="grow">
    <label for="output" data-i18n="json_result">結果</label>
    <textarea id="output" placeholder="変換結果がここに入ります" spellcheck="false"></textarea>
  </div>
  <div id="status"></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
// Strings injected by the launcher for its language; the markup's own
// text (and these fallbacks) stand when opened outside conduit.
const S = window.__conduitStrings || {};
const t = (key, fallback) => S[key] || fallback;
const status_ = (msg, isError) => {
  const el = $("status");
  el.textContent = msg;
  el.className = isError ? "error" : "";
};

// Note: this is JS JSON — integer-like keys re-sort first and numbers
// beyond 2^53 lose precision. The launcher's `json` keyword keeps both.
// The input stays untouched so before and after are both copyable.
function transform(spacing) {
  const src = $("input").value.trim();
  if (!src) {
    // Returning silently here is indistinguishable from a broken button:
    // the placeholder looks like input, so "nothing happened" reads as
    // "the tool does not work".
    $("output").value = "";
    status_(t("json_empty", "入力が空です。整形する JSON を貼り付けてください"));
    return;
  }
  try {
    const value = JSON.parse(src);
    $("output").value = JSON.stringify(value, null, spacing);
    const chars = $("output").value.length;
    status_(
      spacing
        ? t("json_pretty_done", `整形しました（{chars} 文字）`).split("{chars}").join(chars)
        : t("json_minify_done", `圧縮しました（{chars} 文字）`).split("{chars}").join(chars),
    );
  } catch (e) {
    $("output").value = "";
    status_(t("json_parse_failed", "JSON として解析できません: {error}").split("{error}").join(e.message), true);
  }
}

function copy(text) {
  const done = () => status_(t("copied", "コピーしました"));
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(done).catch(() => copyFallback(text, done));
  } else {
    copyFallback(text, done);
  }
}
function copyFallback(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand("copy");
  ta.remove();
  done();
}

$("pretty").onclick = () => transform(2);
$("minify").onclick = () => transform(0);
$("copy-input").onclick = () => copy($("input").value);
$("copy-output").onclick = () => copy($("output").value);
</script>
</body>
</html>
