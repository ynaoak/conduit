<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-i18n="capture_title">スクリーンショット / 録画</title>
<script>
// The launcher passes its theme mode as ?theme=dark|light|system —
// tool windows have no IPC at load time, so the URL is the sync channel.
(() => {
  const theme = new URLSearchParams(location.search).get("theme");
  const media = matchMedia("(prefers-color-scheme: light)");
  const apply = () => {
    const light = theme === "light" || (theme !== "dark" && media.matches);
    document.documentElement.dataset.theme = light ? "light" : "dark";
  };
  apply();
  media.addEventListener("change", apply);
})();
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    /* the launcher injects --conduit-* (tool_window.rs); the literals are
       the fallback for running this file outside conduit */
    --surface: var(--conduit-surface, #0b0a0d);
    --surface-container: var(--conduit-surface-container, #151318);
    --surface-high: var(--conduit-surface-high, #1e1b24);
    --on-surface: var(--conduit-on-surface, #ece9f1);
    --on-variant: var(--conduit-on-variant, #9d97a8);
    --primary: var(--conduit-primary, #a678ff);
    --outline: var(--conduit-outline, #2c2933);
    --on-primary: #241148; --error: #f2b8b5;
  }
  :root[data-theme="light"] {
    --surface: var(--conduit-surface, #faf8f5);
    --surface-container: var(--conduit-surface-container, #f1eeea);
    --surface-high: var(--conduit-surface-high, #e9e6e1);
    --on-surface: var(--conduit-on-surface, #1f1e1b);
    --on-variant: var(--conduit-on-variant, #4a4741);
    --primary: var(--conduit-primary, #8038f8);
    --outline: var(--conduit-outline, #d5d1ca);
    --on-primary: #ffffff; --error: #b3261e;
  }
  body {
    background: var(--surface); color: var(--on-surface); height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", Roboto,
      "Noto Sans JP", "Segoe UI", sans-serif; font-size: 14px;
    display: flex; flex-direction: column; gap: 12px; padding: 16px;
    /* the window is clipped by the injected chrome, and can now be
       resized smaller than this page: what does not fit has to scroll */
    overflow-y: auto; overflow-x: hidden;
  }
  h1 { font-size: 16px; font-weight: 500; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button {
    border: none; border-radius: 999px; padding: 6px 14px; font-size: 12px;
    background: var(--surface-high); color: var(--on-surface); cursor: pointer;
  }
  button.filled { background: var(--primary); color: var(--on-primary); font-weight: 500; padding: 8px 18px; font-size: 13px; }
  button.danger { background: var(--error); color: #241111; font-weight: 500; }
  select {
    background: var(--surface-container); color: var(--on-surface);
    border: 1px solid var(--outline); border-radius: 999px; padding: 6px 10px;
    font: inherit; font-size: 12px; outline: none;
  }
  button:hover { filter: brightness(1.12); }
  button:disabled { opacity: 0.6; cursor: default; }

  /* The list scrolls, the toolbar does not: the buttons are what the
     window is for, and they have to stay reachable at any height. */
  #list {
    flex: 1; min-height: 0; overflow-y: auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
    gap: 10px; align-content: start;
  }
  .card {
    background: var(--surface-container); border: 1px solid var(--outline);
    border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;
  }
  /* A checkerboard behind the preview, so a screenshot of a white page and
     a missing preview do not look the same. */
  .shot {
    position: relative; aspect-ratio: 16 / 10; display: block; width: 100%;
    object-fit: cover; background:
      conic-gradient(from 90deg at 50% 50%, #8883 25%, #0000 0 50%, #8883 0 75%, #0000 0)
      0 0 / 12px 12px;
    cursor: pointer;
  }
  .meta { padding: 6px 8px 8px; display: flex; flex-direction: column; gap: 4px; }
  .when { font-size: 11px; color: var(--on-variant); }
  .dims { font: 11px/1.4 Consolas, "Cascadia Mono", monospace; color: var(--on-variant); }
  .badge {
    align-self: flex-start; font-size: 10px; padding: 1px 7px; border-radius: 999px;
    background: var(--surface-high); color: var(--on-variant);
  }
  .actions { display: flex; gap: 4px; flex-wrap: wrap; }
  .actions button { padding: 4px 9px; font-size: 11px; border-radius: 8px; }
  #empty { color: var(--on-variant); font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
  #status { font-size: 12px; color: var(--on-variant); min-height: 1.2em; }
  #status.error { color: var(--error); }
  #hint { font-size: 11px; color: var(--on-variant); }
</style>
</head>
<body>
  <h1 data-i18n="capture_title">スクリーンショット / 録画</h1>

  <div class="row">
    <button class="filled" id="region" data-i18n="capture_region">範囲を選ぶ</button>
    <button id="screen" data-i18n="capture_screen">画面全体</button>
    <!-- Only shown when there is more than one monitor; with one display
         a picker offering "every screen" and "screen 1" is two names for
         the same thing. -->
    <select id="which" hidden></select>
    <button id="record" data-i18n="capture_record">範囲を録画</button>
    <button class="danger" id="stop" data-i18n="capture_stop" hidden>録画を停止</button>
  </div>

  <div id="status"></div>

  <div id="list"></div>
  <div id="empty">
    <span data-i18n="capture_empty">まだ何も撮っていません</span>
    <span data-i18n="capture_empty_hint">上のボタンか、ランチャーで「スクショ」と入力して撮影できます</span>
  </div>

  <div class="row">
    <button id="folder" data-i18n="capture_folder">保存先を開く</button>
    <button id="clear" data-i18n="capture_clear">履歴を空にする</button>
  </div>
  <div id="hint" data-i18n="capture_hint">履歴はアプリ内に保存され、古いものから自動的に消えます</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const S = window.__conduitStrings || {};
const t = (key, fallback) => S[key] || fallback;
const status_ = (msg, isError) => {
  const el = $("status");
  el.textContent = msg || "";
  el.className = isError ? "error" : "";
};

// Injected by the launcher for built-in packages only (tool_window.rs).
// Absent when this file is opened outside conduit, which is an empty
// gallery rather than an error.
let CAPTURES = Array.isArray(window.__conduitCaptures) ? window.__conduitCaptures : [];

// The launcher's IPC. Without it the page can still show what was
// injected, so the buttons that need the backend are taken away rather
// than left to fail.
const IPC = window.__TAURI_INTERNALS__;
const invoke = (cmd, args) =>
  IPC ? IPC.invoke(cmd, args || {}) : Promise.reject(new Error("no ipc"));

const sizes = ["B", "KB", "MB", "GB"];
function humanSize(bytes) {
  let value = Number(bytes) || 0, unit = 0;
  while (value >= 1024 && unit < sizes.length - 1) { value /= 1024; unit += 1; }
  return unit === 0 ? `${value} B` : `${value.toFixed(1)} ${sizes[unit]}`;
}

// Local time here, where a timezone is actually available — the file
// names are stamped in UTC because Rust has no zone to work with.
const when = (ms) => new Date(Number(ms)).toLocaleString();

function card(capture) {
  const element = document.createElement("div");
  element.className = "card";

  const preview = document.createElement("img");
  preview.className = "shot";
  preview.src = capture.thumb_url || "";
  preview.alt = "";
  preview.title = t("capture_open", "開く");
  preview.onclick = () => act("open_capture", capture.id);
  element.appendChild(preview);

  const meta = document.createElement("div");
  meta.className = "meta";

  const badge = document.createElement("span");
  badge.className = "badge";
  badge.textContent =
    capture.kind === "video"
      ? `${t("capture_video", "録画")} ${Math.round(capture.seconds)}s`
      : t("capture_image", "画像");
  meta.appendChild(badge);

  const time = document.createElement("div");
  time.className = "when";
  time.textContent = when(capture.created_ms);
  meta.appendChild(time);

  const dims = document.createElement("div");
  dims.className = "dims";
  dims.textContent = `${capture.width}×${capture.height} ・ ${humanSize(capture.bytes)}`;
  meta.appendChild(dims);

  const actions = document.createElement("div");
  actions.className = "actions";
  for (const [command, key, fallback] of [
    ["copy_capture", "capture_copy", "コピー"],
    ["open_capture", "capture_open", "開く"],
    ["reveal_capture", "capture_reveal", "フォルダで表示"],
    ["delete_capture", "capture_delete", "削除"],
  ]) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = t(key, fallback);
    button.onclick = () => act(command, capture.id);
    actions.appendChild(button);
  }
  meta.appendChild(actions);

  element.appendChild(meta);
  return element;
}

function render() {
  const list = $("list");
  list.textContent = "";
  for (const capture of CAPTURES) list.appendChild(card(capture));
  $("empty").style.display = CAPTURES.length ? "none" : "flex";
}

function refresh() {
  return invoke("capture_list")
    .then((list) => {
      CAPTURES = Array.isArray(list) ? list : [];
      render();
    })
    .catch(() => {});
}

function act(command, id) {
  return invoke(command, { id })
    .then(() => {
      if (command === "copy_capture") status_(t("capture_copied", "コピーしました"));
      if (command === "delete_capture") return refresh();
      return undefined;
    })
    .catch(fail);
}

function fail(e) {
  status_(String(e && e.message ? e.message : e), true);
}

/** While a recording runs, the only button that matters is stop. */
function showRecording(running) {
  for (const id of ["region", "screen", "record"]) $(id).disabled = running;
  $("stop").hidden = !running;
  status_(running ? t("capture_recording", "録画中…") : "");
}

function capture(mode) {
  status_("");
  for (const id of ["region", "screen", "record"]) $(id).disabled = true;
  // "" is every monitor at once; a number is that monitor alone.
  const which = $("which").value;
  const screen = mode === "screen" && which !== "" ? Number(which) : null;
  return invoke("take_capture", { mode, screen })
    .then(() => {
      if (mode === "record") {
        showRecording(true);
        return undefined;
      }
      return refresh();
    })
    .catch(fail)
    .finally(() => {
      if ($("stop").hidden) {
        for (const id of ["region", "screen", "record"]) $(id).disabled = false;
      }
    });
}

if (!IPC) {
  for (const id of ["region", "screen", "record", "stop", "folder", "clear"]) {
    $(id).style.display = "none";
  }
} else {
  $("region").onclick = () => capture("region");
  $("screen").onclick = () => capture("screen");
  $("record").onclick = () => capture("record");
  $("stop").onclick = () => {
    $("stop").disabled = true;
    invoke("stop_recording")
      .then(() => refresh())
      .catch(fail)
      .finally(() => {
        $("stop").disabled = false;
        showRecording(false);
      });
  };
  $("folder").onclick = () => invoke("open_captures_folder").catch(fail);
  $("clear").onclick = () => {
    if (!CAPTURES.length) return;
    if (!confirm(t("capture_clear_confirm", "履歴のキャプチャをすべて削除します。よろしいですか？"))) return;
    invoke("clear_captures").then(refresh).catch(fail);
  };

  // A recording may already be running when this window opens — from the
  // launcher, or from a previous visit to this one.
  invoke("recording_state")
    .then((state) => showRecording(Boolean(state && state.running)))
    .catch(() => {});

  // The monitor picker, if there is a choice to make
  invoke("capture_screens")
    .then((screens) => {
      if (!Array.isArray(screens) || screens.length < 2) return;
      const select = $("which");
      const option = (value, label) => {
        const element = document.createElement("option");
        element.value = value;
        element.textContent = label;
        select.appendChild(element);
      };
      option("", t("capture_screen_all", "すべての画面"));
      for (const screen of screens) {
        const name = t("capture_screen_one", "画面 {n}").replace("{n}", screen.index + 1);
        option(String(screen.index), `${name} (${screen.bounds.width}×${screen.bounds.height})`);
      }
      select.hidden = false;
    })
    .catch(() => {});
}

render();
</script>
</body>
</html>
