<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-i18n="count_title">文字数カウンター</title>
<script>
// The launcher passes its theme mode as ?theme=dark|light|system —
// tool windows have no IPC, so the URL is the sync channel. "system"
// (or no param, e.g. opened from a file) follows the OS live.
(() => {
  const theme = new URLSearchParams(location.search).get("theme");
  const media = matchMedia("(prefers-color-scheme: light)");
  const apply = () => {
    const light = theme === "light" || (theme !== "dark" && media.matches);
    document.documentElement.dataset.theme = light ? "light" : "dark";
  };
  apply();
  media.addEventListener("change", apply);
})();
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    /* the launcher injects --conduit-* (tool_window.rs); the literals are
       the fallback for running this file outside conduit */
    --surface: var(--conduit-surface, #0b0a0d);
    --surface-container: var(--conduit-surface-container, #151318);
    --surface-high: var(--conduit-surface-high, #1e1b24);
    --on-surface: var(--conduit-on-surface, #ece9f1);
    --on-variant: var(--conduit-on-variant, #9d97a8);
    --primary: var(--conduit-primary, #a678ff);
    --outline: var(--conduit-outline, #2c2933);
    --on-primary: #241148; --error: #f2b8b5;
  }
  /* light palette, applied by the theme script below */
  :root[data-theme="light"] {
    --surface: var(--conduit-surface, #faf8f5);
    --surface-container: var(--conduit-surface-container, #f1eeea);
    --surface-high: var(--conduit-surface-high, #e9e6e1);
    --on-surface: var(--conduit-on-surface, #1f1e1b);
    --on-variant: var(--conduit-on-variant, #4a4741);
    --primary: var(--conduit-primary, #8038f8);
    --outline: var(--conduit-outline, #d5d1ca);
    --on-primary: #ffffff; --error: #b3261e;
  }
  body {
    background: var(--surface); color: var(--on-surface);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", Roboto,
      "Noto Sans JP", "Segoe UI", sans-serif; font-size: 14px;
    display: flex; flex-direction: column; gap: 16px; padding: 16px;
    /* the window is clipped by the injected chrome, and can now be
       resized smaller than this page: what does not fit has to scroll */
    overflow-y: auto; overflow-x: hidden;
  }
  h1 { font-size: 16px; font-weight: 500; }
  h2 { font-size: 13px; font-weight: 500; color: var(--on-variant); margin-bottom: 8px; }
  section {
    background: var(--surface-container); border: 1px solid var(--outline);
    border-radius: 12px; padding: 14px;
  }
  input {
    background: var(--surface); color: var(--on-surface);
    border: 1px solid var(--outline); border-radius: 8px; padding: 8px 12px;
    font: 13px Consolas, "Cascadia Mono", monospace; outline: none; width: 100%;
  }
  input:focus { border-color: var(--primary); }
  /* A monospace placeholder in the same font as the content reads as
     content — which is how an empty box ends up looking filled in.
     Italic separates them at a glance; the content is never italic. */
  input::placeholder {
    color: var(--on-variant); opacity: 0.7; font-style: italic;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  button {
    border: none; border-radius: 999px; padding: 7px 16px; font-size: 13px;
    background: var(--surface-high); color: var(--on-surface); cursor: pointer;
    flex-shrink: 0;
  }
  button.filled { background: var(--primary); color: var(--on-primary); font-weight: 500; }
  button:hover { filter: brightness(1.12); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 4px 0; vertical-align: top; }
  td:first-child { color: var(--on-variant); width: 7.5em; }
  td.value { font-family: Consolas, "Cascadia Mono", monospace; user-select: text; }
  textarea {
    width: 100%; min-height: 160px; resize: vertical;
    background: var(--surface); color: var(--on-surface);
    border: 1px solid var(--outline); border-radius: 8px; padding: 10px 12px;
    font: 13px/1.6 Consolas, "Cascadia Mono", monospace; outline: none;
  }
  textarea:focus { border-color: var(--primary); }
  textarea::placeholder { color: var(--on-variant); opacity: 0.7; font-style: italic; }
  .counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
  .count { background: var(--surface); border: 1px solid var(--outline); border-radius: 10px; padding: 10px 12px; }
  .count .n { font: 600 20px/1.2 Consolas, "Cascadia Mono", monospace; user-select: text; }
  .count .k { font-size: 11px; color: var(--on-variant); margin-top: 2px; }
  .note { font-size: 11px; color: var(--on-variant); margin-top: 10px; line-height: 1.5; }
  #status { font-size: 12px; color: var(--on-variant); min-height: 1.2em; }
  #status.error { color: var(--error); }
</style>
</head>
<body>
  <h1 data-i18n="count_title">文字数カウンター</h1>

  <section>
    <textarea id="input" data-i18n-placeholder="count_placeholder"
      placeholder="ここに文章を貼り付けると、下の数がその場で変わります" spellcheck="false"></textarea>
    <div class="row">
      <button id="paste" data-i18n="count_paste">クリップボードから貼り付け</button>
      <button id="clear" data-i18n="count_clear">消す</button>
    </div>
  </section>

  <section>
    <h2 data-i18n="count_result">カウント</h2>
    <div class="counts">
      <div class="count"><div class="n" id="c-chars">0</div><div class="k" data-i18n="count_chars">文字</div></div>
      <div class="count"><div class="n" id="c-nospace">0</div><div class="k" data-i18n="count_nospace">空白を除く</div></div>
      <div class="count"><div class="n" id="c-words">0</div><div class="k" data-i18n="count_words">単語</div></div>
      <div class="count"><div class="n" id="c-lines">0</div><div class="k" data-i18n="count_lines">行</div></div>
      <div class="count"><div class="n" id="c-bytes">0</div><div class="k" data-i18n="count_bytes">バイト (UTF-8)</div></div>
      <div class="count"><div class="n" id="c-sheets">0</div><div class="k" data-i18n="count_sheets">原稿用紙 (400字)</div></div>
    </div>
    <p class="note" id="method"></p>
  </section>

  <div id="status"></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const S = window.__conduitStrings || {};
const t = (key, fallback) => S[key] || fallback;
const status_ = (msg, isError) => {
  const el = $("status");
  el.textContent = msg;
  el.className = isError ? "error" : "";
};

// A "character" is not a UTF-16 code unit. "𩸽" is two of them and an
// emoji family is seven, so `text.length` reports numbers no one would
// call a character count. Intl.Segmenter counts what a reader would point
// at; the fallback below is code points, which is still closer than
// .length.
const segmenters = (() => {
  if (typeof Intl === "undefined" || !Intl.Segmenter) return null;
  try {
    return {
      grapheme: new Intl.Segmenter(undefined, { granularity: "grapheme" }),
      word: new Intl.Segmenter(undefined, { granularity: "word" }),
    };
  } catch (e) {
    return null;
  }
})();

function countCharacters(text) {
  if (segmenters) {
    let n = 0;
    for (const _ of segmenters.grapheme.segment(text)) n++;
    return n;
  }
  return [...text].length;
}

// Splitting on whitespace is an English assumption: 「今日は良い天気」 is
// one "word" that way. Intl.Segmenter knows where the boundaries are in
// both scripts, and isWordLike drops the punctuation between them.
function countWords(text) {
  if (segmenters) {
    let n = 0;
    for (const segment of segmenters.word.segment(text)) {
      if (segment.isWordLike) n++;
    }
    return n;
  }
  const matched = text.match(/[^\s]+/g);
  return matched ? matched.length : 0;
}

const encoder = new TextEncoder();

function update() {
  const text = $("input").value;
  const chars = countCharacters(text);
  $("c-chars").textContent = chars.toLocaleString();
  $("c-nospace").textContent = countCharacters(text.replace(/\s/g, "")).toLocaleString();
  $("c-words").textContent = countWords(text).toLocaleString();
  // An empty box is zero lines; anything else has one more line than it
  // has newlines, trailing newline included.
  $("c-lines").textContent = (text === "" ? 0 : text.split(/\r\n|\r|\n/).length).toLocaleString();
  $("c-bytes").textContent = encoder.encode(text).length.toLocaleString();
  // Sheets needed, not sheets filled: 401 characters is two sheets, the
  // second one nearly empty. A fraction here would answer a question
  // nobody asks.
  $("c-sheets").textContent = Math.ceil(chars / 400).toLocaleString();
}

$("method").textContent = segmenters
  ? t("count_method_segmenter", "絵文字や結合文字も 1 文字として数えます")
  : t("count_method_fallback", "この環境では簡易な数え方です（絵文字が 2 文字になることがあります）");

$("input").addEventListener("input", update);
$("clear").onclick = () => {
  $("input").value = "";
  update();
  $("input").focus();
};
$("paste").onclick = async () => {
  try {
    const text = await navigator.clipboard.readText();
    $("input").value = text;
    update();
    status_("");
  } catch (e) {
    status_(t("count_paste_failed", "クリップボードを読めませんでした。貼り付けは Ctrl+V / Cmd+V でもできます"), true);
  }
};


// Something the launcher sent here (tool_window.rs injects it when a
// result is handed to this window). Absent on a plain launch, which is
// the empty page this tool has always opened as.
const SENT = window.__conduitInput;
if (SENT && SENT.kind === "text") {
  $("input").value = SENT.value;
}

update();
</script>
</body>
</html>
