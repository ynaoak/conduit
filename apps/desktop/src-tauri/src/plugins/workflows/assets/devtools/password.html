<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-i18n="password_title">パスワード生成</title>
<script>
// The launcher passes its theme mode as ?theme=dark|light|system —
// tool windows have no IPC, so the URL is the sync channel. "system"
// (or no param, e.g. opened from a file) follows the OS live.
(() => {
  const theme = new URLSearchParams(location.search).get("theme");
  const media = matchMedia("(prefers-color-scheme: light)");
  const apply = () => {
    const light = theme === "light" || (theme !== "dark" && media.matches);
    document.documentElement.dataset.theme = light ? "light" : "dark";
  };
  apply();
  media.addEventListener("change", apply);
})();
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    /* the launcher injects --conduit-* (tool_window.rs); the literals are
       the fallback for running this file outside conduit */
    --surface: var(--conduit-surface, #0b0a0d);
    --surface-container: var(--conduit-surface-container, #151318);
    --surface-high: var(--conduit-surface-high, #1e1b24);
    --on-surface: var(--conduit-on-surface, #ece9f1);
    --on-variant: var(--conduit-on-variant, #9d97a8);
    --primary: var(--conduit-primary, #a678ff);
    --outline: var(--conduit-outline, #2c2933);
    --on-primary: #241148; --error: #f2b8b5;
  }
  /* light palette, applied by the theme script below */
  :root[data-theme="light"] {
    --surface: var(--conduit-surface, #faf8f5);
    --surface-container: var(--conduit-surface-container, #f1eeea);
    --surface-high: var(--conduit-surface-high, #e9e6e1);
    --on-surface: var(--conduit-on-surface, #1f1e1b);
    --on-variant: var(--conduit-on-variant, #4a4741);
    --primary: var(--conduit-primary, #8038f8);
    --outline: var(--conduit-outline, #d5d1ca);
    --on-primary: #ffffff; --error: #b3261e;
  }
  body {
    background: var(--surface); color: var(--on-surface);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", Roboto,
      "Noto Sans JP", "Segoe UI", sans-serif; font-size: 14px;
    display: flex; flex-direction: column; gap: 16px; padding: 16px;
    /* the window is clipped by the injected chrome, and can now be
       resized smaller than this page: what does not fit has to scroll */
    overflow-y: auto; overflow-x: hidden;
  }
  h1 { font-size: 16px; font-weight: 500; }
  h2 { font-size: 13px; font-weight: 500; color: var(--on-variant); margin-bottom: 8px; }
  section {
    background: var(--surface-container); border: 1px solid var(--outline);
    border-radius: 12px; padding: 14px;
  }
  input {
    background: var(--surface); color: var(--on-surface);
    border: 1px solid var(--outline); border-radius: 8px; padding: 8px 12px;
    font: 13px Consolas, "Cascadia Mono", monospace; outline: none; width: 100%;
  }
  input:focus { border-color: var(--primary); }
  /* A monospace placeholder in the same font as the content reads as
     content — which is how an empty box ends up looking filled in.
     Italic separates them at a glance; the content is never italic. */
  input::placeholder {
    color: var(--on-variant); opacity: 0.7; font-style: italic;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  button {
    border: none; border-radius: 999px; padding: 7px 16px; font-size: 13px;
    background: var(--surface-high); color: var(--on-surface); cursor: pointer;
    flex-shrink: 0;
  }
  button.filled { background: var(--primary); color: var(--on-primary); font-weight: 500; }
  button:hover { filter: brightness(1.12); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 4px 0; vertical-align: top; }
  td:first-child { color: var(--on-variant); width: 7.5em; }
  td.value { font-family: Consolas, "Cascadia Mono", monospace; user-select: text; }
  label.check { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
  input[type="checkbox"] { accent-color: var(--primary); width: auto; }
  .numbers { display: flex; gap: 12px; flex-wrap: wrap; }
  .numbers .field { flex: 1; min-width: 140px; margin-top: 0; }
  .numbers label { display: block; font-size: 12px; color: var(--on-variant); margin-bottom: 4px; }
  .numbers input { font: 600 16px Consolas, "Cascadia Mono", monospace; }
  /* Numbered so ten of them can be talked about ("the third one") */
  li .i { font-size: 11px; color: var(--on-variant); width: 1.8em; text-align: right; }
  .checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 12px; }
  /* Every candidate in a run is the same length, so they tile: two
     columns where the window is wide enough, one where it is not, which
     halves the scrolling for the 50- and 200-count runs. */
  ul {
    list-style: none; display: grid; gap: 6px;
    grid-template-columns: repeat(auto-fill, minmax(228px, 1fr));
  }
  li {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--outline);
    border-radius: 8px; padding: 8px 10px;
  }
  li code {
    flex: 1; font: 14px Consolas, "Cascadia Mono", monospace;
    user-select: all; word-break: break-all;
  }
  li button { padding: 4px 10px; font-size: 12px; }
  .hidden { display: none; }
  .meter { height: 6px; border-radius: 3px; background: var(--surface-high); overflow: hidden; margin-top: 10px; }
  .meter > div { height: 100%; width: 0; background: var(--primary); transition: width 120ms ease; }
  .strength { display: flex; justify-content: space-between; font-size: 12px; color: var(--on-variant); margin-top: 6px; }
  table.form { width: 100%; border-collapse: collapse; }
  table.form th {
    width: 5.5em; text-align: left; vertical-align: top; font-weight: 500;
    font-size: 12px; color: var(--on-variant); padding: 8px 10px 8px 0; white-space: nowrap;
  }
  table.form td { padding: 8px 0; border-top: 1px solid var(--outline); }
  table.form tr:first-child td, table.form tr:first-child th { border-top: none; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
  label.check { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
  input[type="radio"], input[type="checkbox"] { accent-color: var(--primary); width: auto; margin: 0; }
  input.num { width: 5em; padding: 4px 8px; font: 13px Consolas, "Cascadia Mono", monospace; }
  /* Every candidate in a run is the same length, so they tile: two
     columns where the window is wide enough, one where it is not, which
     halves the scrolling for the 50- and 200-count runs. */
  ul {
    list-style: none; display: grid; gap: 6px;
    grid-template-columns: repeat(auto-fill, minmax(228px, 1fr));
  }
  li {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--outline);
    border-radius: 8px; padding: 8px 10px;
  }
  li .i { font-size: 11px; color: var(--on-variant); width: 2em; text-align: right; flex-shrink: 0; }
  li code { flex: 1; font: 13px Consolas, "Cascadia Mono", monospace; user-select: all; word-break: break-all; }
  li button { padding: 4px 10px; font-size: 12px; }
  pre#bulk {
    background: var(--surface); border: 1px solid var(--outline); border-radius: 8px;
    padding: 10px 12px; font: 13px/1.6 Consolas, "Cascadia Mono", monospace;
    user-select: text; max-height: 320px; overflow: auto;
  }
  .meter { height: 6px; border-radius: 3px; background: var(--surface-high); overflow: hidden; margin-top: 10px; }
  .meter > div { height: 100%; width: 0; background: var(--primary); transition: width 120ms ease; }
  .strength { display: flex; justify-content: space-between; font-size: 12px; color: var(--on-variant); margin-top: 6px; }
  #status { font-size: 12px; color: var(--on-variant); min-height: 1.2em; }
  #status.error { color: var(--error); }
</style>
</head>
<body>
  <h1 data-i18n="password_title">パスワード生成</h1>

  <section>
    <table class="form">
      <tr>
        <th data-i18n="password_strength">強度</th>
        <td><div class="opts">
          <label class="check"><input type="radio" name="preset" value="custom" checked /><span data-i18n="password_custom">カスタム</span></label>
          <label class="check"><input type="radio" name="preset" value="strong" /><span data-i18n="password_preset_strong">強力</span></label>
          <label class="check"><input type="radio" name="preset" value="strongest" /><span data-i18n="password_preset_strongest">最強</span></label>
        </div></td>
      </tr>
      <tr>
        <th data-i18n="password_chars">文字</th>
        <td>
          <div class="opts">
            <label class="check"><input type="checkbox" id="upper" checked /><span data-i18n="password_upper">英字（大文字）</span></label>
            <label class="check"><input type="checkbox" id="lower" checked /><span data-i18n="password_lower">英字（小文字）</span></label>
            <label class="check"><input type="checkbox" id="digit" checked /><span data-i18n="password_digit">数字</span></label>
          </div>
          <div class="opts" style="margin-top:8px">
            <label class="check"><input type="radio" name="symbol" value="off" checked /><span data-i18n="password_symbol_off">記号なし</span></label>
            <label class="check"><input type="radio" name="symbol" value="on" /><span data-i18n="password_symbol_on">記号あり</span></label>
          </div>
          <div class="opts" style="margin-top:8px">
            <label class="check"><input type="checkbox" id="require-all" checked /><span data-i18n="password_require_all">選択文字種を必須で含める</span></label>
          </div>
        </td>
      </tr>
      <tr>
        <th data-i18n="password_length">文字数</th>
        <td><div class="opts">
          <label class="check"><input type="radio" name="length" value="free" /><input class="num" type="number" id="length-free" min="2" max="40" value="20" /><span data-i18n="password_unit_chars">文字</span></label>
          <label class="check"><input type="radio" name="length" value="8" /><span>8</span><span data-i18n="password_unit_chars">文字</span></label>
          <label class="check"><input type="radio" name="length" value="12" /><span>12</span><span data-i18n="password_unit_chars">文字</span></label>
          <label class="check"><input type="radio" name="length" value="16" checked /><span>16</span><span data-i18n="password_unit_chars">文字</span></label>
        </div></td>
      </tr>
      <tr>
        <th data-i18n="password_count">個数</th>
        <td><div class="opts">
          <label class="check"><input type="radio" name="count" value="free" /><input class="num" type="number" id="count-free" min="1" max="1000" value="20" /><span data-i18n="password_unit_count">個</span></label>
          <label class="check"><input type="radio" name="count" value="10" checked /><span>10</span><span data-i18n="password_unit_count">個</span></label>
          <label class="check"><input type="radio" name="count" value="50" /><span>50</span><span data-i18n="password_unit_count">個</span></label>
          <label class="check"><input type="radio" name="count" value="200" /><span>200</span><span data-i18n="password_unit_count">個</span></label>
        </div></td>
      </tr>
      <tr>
        <th data-i18n="password_other">その他</th>
        <td>
          <label class="check"><input type="checkbox" id="unambiguous" checked /><span data-i18n="password_unambiguous">似通った英数字は省く</span></label>
          <label class="check" style="margin-top:8px"><input type="checkbox" id="no-repeat" checked /><span data-i18n="password_no_repeat">8文字以内の場合、同じ文字は2回以上使わない</span></label>
        </td>
      </tr>
    </table>

    <div class="meter"><div id="meter-bar"></div></div>
    <div class="strength">
      <span id="entropy"></span>
      <span id="verdict"></span>
    </div>
    <div class="row">
      <button class="filled" id="generate" data-i18n="password_generate">生成する</button>
    </div>
  </section>

  <section>
    <h2 data-i18n="password_result">候補</h2>
    <ul id="list"></ul>
    <pre id="bulk" class="hidden"></pre>
    <div class="row">
      <button id="copy-all" data-i18n="password_copy_all">すべてコピー（改行区切り）</button>
    </div>
  </section>

  <div id="status"></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const S = window.__conduitStrings || {};
const t = (key, fallback) => S[key] || fallback;
const status_ = (msg, isError) => {
  const el = $("status");
  el.textContent = msg;
  el.className = isError ? "error" : "";
};

const LENGTH = { min: 2, max: 40 };
const COUNT = { min: 1, max: 1000 };
/** Past this many, a row each with its own copy button is more DOM than
 *  it is useful; the whole set goes into one block instead. */
const ROWS_MAX = 100;
/** The option only claims to apply to short passwords, and past the size
 *  of the alphabet it would be impossible anyway. */
const NO_REPEAT_UPTO = 8;

const SETS = {
  upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
  lower: "abcdefghijklmnopqrstuvwxyz",
  digit: "0123456789",
  // Kept to what shells, CSV and most password fields accept without
  // quoting or escaping — a password that cannot be pasted somewhere is a
  // password that gets replaced with a worse one.
  symbol: "!#$%&*+-=?@^_",
};
/** Characters that get misread aloud or off a screen. */
const AMBIGUOUS = /[0O1lI|]/g;

const radio = (name) => document.querySelector(`input[name="${name}"]:checked`).value;
const setRadio = (name, value) => {
  const el = document.querySelector(`input[name="${name}"][value="${value}"]`);
  if (el) el.checked = true;
};

function clamp(value, bounds, fallback) {
  const n = Math.floor(Number(value));
  if (!Number.isFinite(n)) return fallback;
  return Math.min(bounds.max, Math.max(bounds.min, n));
}

function chosenLength() {
  const choice = radio("length");
  if (choice !== "free") return Number(choice);
  const n = clamp($("length-free").value, LENGTH, 16);
  $("length-free").value = String(n);
  return n;
}

function chosenCount() {
  const choice = radio("count");
  if (choice !== "free") return Number(choice);
  const n = clamp($("count-free").value, COUNT, 10);
  $("count-free").value = String(n);
  return n;
}

function selectedSets() {
  const ids = ["upper", "lower", "digit"].filter((id) => $(id).checked);
  if (radio("symbol") === "on") ids.push("symbol");
  return ids.map((id) => ($("unambiguous").checked ? SETS[id].replace(AMBIGUOUS, "") : SETS[id]))
    .filter((set) => set.length > 0);
}

const alphabet = () => selectedSets().join("");

// Uniform over `max`, not `random % max`. Taking a modulus of a random
// byte makes the first few characters of the alphabet more likely, which
// is exactly the bias an attacker's dictionary is built around.
function randomBelow(max) {
  const limit = Math.floor(256 / max) * max;
  const buffer = new Uint8Array(1);
  for (;;) {
    crypto.getRandomValues(buffer);
    if (buffer[0] < limit) return buffer[0] % max;
  }
}

function draw(chars, length) {
  let out = "";
  for (let i = 0; i < length; i++) out += chars[randomBelow(chars.length)];
  return out;
}

/** Constraints are met by drawing again, never by editing a drawn
 *  password: overwriting a position to force a digit into it makes that
 *  position predictable. */
function generate(chars, length, sets, requireAll, noRepeat) {
  const wantsUnique = noRepeat && length <= NO_REPEAT_UPTO && length <= chars.length;
  for (let attempt = 0; attempt < 500; attempt++) {
    const candidate = draw(chars, length);
    if (requireAll && !sets.every((set) => [...candidate].some((c) => set.includes(c)))) continue;
    if (wantsUnique && new Set(candidate).size !== length) continue;
    return candidate;
  }
  // Unsatisfiable in practice only for absurd combinations; the draw is
  // still uniform, just without the extra guarantees.
  return draw(chars, length);
}

const entropyBits = (size, length) => (size > 1 ? Math.log2(size) * length : 0);

/** Describes the settings, so it follows the controls without waiting for
 *  a run. The figure is an upper bound: "must include" and "no repeats"
 *  both shave a little off it. */
function updateStrength() {
  const chars = alphabet();
  const length = chosenLength();
  if (chars.length === 0) {
    $("meter-bar").style.width = "0";
    $("entropy").textContent = "";
    $("verdict").textContent = "";
    return;
  }
  const bits = entropyBits(chars.length, length);
  $("entropy").textContent = t("password_entropy", "エントロピー") + ": " + Math.round(bits)
    + " bit / " + chars.length + " " + t("password_alphabet", "種類");
  // 128 bits is the point past which the meter stops being interesting
  $("meter-bar").style.width = Math.min(100, (bits / 128) * 100) + "%";
  $("verdict").textContent =
    bits < 60 ? t("password_weak", "弱い")
    : bits < 80 ? t("password_ok", "まずまず")
    : bits < 128 ? t("password_strong", "強い")
    : t("password_very_strong", "非常に強い");
}

let generated = [];

function render() {
  const sets = selectedSets();
  const chars = sets.join("");
  const length = chosenLength();
  const count = chosenCount();
  updateStrength();

  $("list").textContent = "";
  $("bulk").textContent = "";
  $("bulk").classList.add("hidden");

  if (chars.length === 0) {
    generated = [];
    status_(t("password_no_charset", "文字種を 1 つ以上選んでください"), true);
    return;
  }
  status_("");

  const requireAll = $("require-all").checked;
  const noRepeat = $("no-repeat").checked;
  generated = [];
  for (let i = 0; i < count; i++) generated.push(generate(chars, length, sets, requireAll, noRepeat));

  if (generated.length > ROWS_MAX) {
    $("bulk").textContent = generated.join("\n");
    $("bulk").classList.remove("hidden");
    return;
  }
  const list = $("list");
  for (let i = 0; i < generated.length; i++) {
    const value = generated[i];
    const item = document.createElement("li");
    const index = document.createElement("span");
    index.className = "i";
    index.textContent = String(i + 1);
    const code = document.createElement("code");
    code.textContent = value;
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = t("password_copy", "コピー");
    button.onclick = () => copy(value);
    item.append(index, code, button);
    list.appendChild(item);
  }
}

// navigator.clipboard needs a secure context, which a custom-protocol
// origin may not be — fall back to execCommand
function copy(text) {
  const done = () => status_(t("copied", "コピーしました"));
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(done).catch(() => copyFallback(text, done));
  } else {
    copyFallback(text, done);
  }
}
function copyFallback(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand("copy");
  ta.remove();
  done();
}

/** The presets are shorthand for a set of controls, so they set them —
 *  leaving the form showing what will actually happen rather than hiding
 *  it behind a word. */
const PRESETS = {
  strong: { upper: true, lower: true, digit: true, symbol: "off", length: "12", unambiguous: true },
  strongest: { upper: true, lower: true, digit: true, symbol: "on", length: "free", free: 32, unambiguous: false },
};

function applyPreset(name) {
  const preset = PRESETS[name];
  if (!preset) return;
  quiet = true;
  for (const id of ["upper", "lower", "digit"]) $(id).checked = preset[id];
  setRadio("symbol", preset.symbol);
  setRadio("length", preset.length);
  if (preset.free) $("length-free").value = String(preset.free);
  $("unambiguous").checked = preset.unambiguous;
  $("require-all").checked = true;
  quiet = false;
  updateStrength();
  markStale();
}

let quiet = false;

function markStale() {
  if (generated.length) status_(t("password_stale", "条件を変えました。もう一度「生成する」を押してください"));
}

/** Touching any control means the form no longer matches a preset. */
function onSettingChanged() {
  if (quiet) return;
  setRadio("preset", "custom");
  updateStrength();
  markStale();
}

for (const input of document.querySelectorAll(
  '#upper, #lower, #digit, #unambiguous, #require-all, #no-repeat, input[name="symbol"]'
)) {
  input.addEventListener("change", onSettingChanged);
}
for (const input of document.querySelectorAll('input[name="length"], input[name="count"]')) {
  input.addEventListener("change", onSettingChanged);
}
// Typing in a free box is only meaningful with its radio selected, so
// selecting it is part of typing in it.
$("length-free").addEventListener("input", () => {
  setRadio("length", "free");
  onSettingChanged();
});
$("count-free").addEventListener("input", () => {
  setRadio("count", "free");
  onSettingChanged();
});
for (const input of document.querySelectorAll('input[name="preset"]')) {
  input.addEventListener("change", () => applyPreset(input.value));
}

$("generate").onclick = render;
$("copy-all").onclick = () => {
  if (generated.length) copy(generated.join("\n"));
};
document.addEventListener("keydown", (event) => {
  if (event.key === "Enter") render();
});

updateStrength();
render();
</script>
</body>
</html>
