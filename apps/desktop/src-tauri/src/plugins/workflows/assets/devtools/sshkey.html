<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-i18n="sshkey_title">SSH 鍵の生成</title>
<script>
// The launcher passes its theme mode as ?theme=dark|light|system —
// tool windows have no IPC, so the URL is the sync channel. "system"
// (or no param, e.g. opened from a file) follows the OS live.
(() => {
  const theme = new URLSearchParams(location.search).get("theme");
  const media = matchMedia("(prefers-color-scheme: light)");
  const apply = () => {
    const light = theme === "light" || (theme !== "dark" && media.matches);
    document.documentElement.dataset.theme = light ? "light" : "dark";
  };
  apply();
  media.addEventListener("change", apply);
})();
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    /* the launcher injects --conduit-* (tool_window.rs); the literals are
       the fallback for running this file outside conduit */
    --surface: var(--conduit-surface, #0b0a0d);
    --surface-container: var(--conduit-surface-container, #151318);
    --surface-high: var(--conduit-surface-high, #1e1b24);
    --on-surface: var(--conduit-on-surface, #ece9f1);
    --on-variant: var(--conduit-on-variant, #9d97a8);
    --primary: var(--conduit-primary, #a678ff);
    --outline: var(--conduit-outline, #2c2933);
    --on-primary: #241148; --error: #f2b8b5;
  }
  /* light palette, applied by the theme script below */
  :root[data-theme="light"] {
    --surface: var(--conduit-surface, #faf8f5);
    --surface-container: var(--conduit-surface-container, #f1eeea);
    --surface-high: var(--conduit-surface-high, #e9e6e1);
    --on-surface: var(--conduit-on-surface, #1f1e1b);
    --on-variant: var(--conduit-on-variant, #4a4741);
    --primary: var(--conduit-primary, #8038f8);
    --outline: var(--conduit-outline, #d5d1ca);
    --on-primary: #ffffff; --error: #b3261e;
  }
  body {
    background: var(--surface); color: var(--on-surface);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", Roboto,
      "Noto Sans JP", "Segoe UI", sans-serif; font-size: 14px;
    display: flex; flex-direction: column; gap: 16px; padding: 16px;
    /* the window is clipped by the injected chrome, and can now be
       resized smaller than this page: what does not fit has to scroll */
    overflow-y: auto; overflow-x: hidden;
  }
  h1 { font-size: 16px; font-weight: 500; }
  h2 { font-size: 13px; font-weight: 500; color: var(--on-variant); margin-bottom: 8px; }
  section {
    background: var(--surface-container); border: 1px solid var(--outline);
    border-radius: 12px; padding: 14px;
  }
  input {
    background: var(--surface); color: var(--on-surface);
    border: 1px solid var(--outline); border-radius: 8px; padding: 8px 12px;
    font: 13px Consolas, "Cascadia Mono", monospace; outline: none; width: 100%;
  }
  input:focus { border-color: var(--primary); }
  /* A monospace placeholder in the same font as the content reads as
     content — which is how an empty box ends up looking filled in.
     Italic separates them at a glance; the content is never italic. */
  input::placeholder {
    color: var(--on-variant); opacity: 0.7; font-style: italic;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  button {
    border: none; border-radius: 999px; padding: 7px 16px; font-size: 13px;
    background: var(--surface-high); color: var(--on-surface); cursor: pointer;
    flex-shrink: 0;
  }
  button.filled { background: var(--primary); color: var(--on-primary); font-weight: 500; }
  button:hover { filter: brightness(1.12); }
  /* Generation takes seconds for RSA; a button that is busy has to look
     unavailable rather than unresponsive. */
  button:disabled { opacity: 0.45; cursor: default; filter: none; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 4px 0; vertical-align: top; }
  td:first-child { color: var(--on-variant); width: 7.5em; }
  td.value { font-family: Consolas, "Cascadia Mono", monospace; user-select: text; }
  label.check { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
  input[type="radio"], input[type="checkbox"] { accent-color: var(--primary); width: auto; }
  .choices { display: flex; gap: 16px; flex-wrap: wrap; }
  .field { margin-top: 12px; }
  .field > label { display: block; font-size: 12px; color: var(--on-variant); margin-bottom: 4px; }
  pre {
    background: var(--surface); border: 1px solid var(--outline); border-radius: 8px;
    padding: 10px 12px; font: 12px/1.5 Consolas, "Cascadia Mono", monospace;
    white-space: pre-wrap; word-break: break-all; user-select: text; max-height: 220px; overflow: auto;
  }
  .fp { font: 12px Consolas, "Cascadia Mono", monospace; color: var(--on-variant); user-select: text; }
  /* A private key on screen is a private key on someone's shoulder. It
     stays folded away until asked for. */
  details > summary {
    cursor: pointer; font-size: 13px; color: var(--on-variant);
    padding: 6px 0; list-style: none;
  }
  details > summary::before { content: "▸ "; }
  details[open] > summary::before { content: "▾ "; }
  .warn {
    font-size: 12px; line-height: 1.6; color: var(--on-variant);
    border-left: 2px solid var(--primary); padding-left: 10px; margin-top: 10px;
  }
  .hidden { display: none; }

  #status { font-size: 12px; color: var(--on-variant); min-height: 1.2em; }
  #status.error { color: var(--error); }
</style>
</head>
<body>
  <h1 data-i18n="sshkey_title">SSH 鍵の生成（git 用）</h1>

  <section>
    <h2 data-i18n="sshkey_type">鍵の種類</h2>
    <div class="choices">
      <label class="check"><input type="radio" name="kind" value="ed25519" checked /><span data-i18n="sshkey_ed25519">Ed25519（推奨）</span></label>
      <label class="check"><input type="radio" name="kind" value="rsa" /><span data-i18n="sshkey_rsa">RSA 4096（古いホスト用）</span></label>
    </div>

    <div class="field">
      <label for="comment" data-i18n="sshkey_comment">コメント（どの端末の鍵か分かる文字列）</label>
      <input id="comment" placeholder="you@example.com" spellcheck="false" />
    </div>

    <div class="field">
      <label for="passphrase" data-i18n="sshkey_passphrase">パスフレーズ（空なら暗号化しない）</label>
      <input id="passphrase" type="password" autocomplete="new-password" />
    </div>

    <div class="row">
      <button class="filled" id="generate" data-i18n="sshkey_generate">生成する</button>
    </div>
    <p class="warn" id="rsa-note" data-i18n="sshkey_rsa_note">RSA 4096 は生成に数秒かかります。</p>
  </section>

  <section id="result" class="hidden">
    <h2 data-i18n="sshkey_public">公開鍵（ホストに登録するのはこちら）</h2>
    <pre id="public"></pre>
    <div class="fp" id="fingerprint"></div>
    <div class="row">
      <button id="copy-public" data-i18n="sshkey_copy_public">公開鍵をコピー</button>
      <button id="save" data-i18n="sshkey_save">ファイルに保存</button>
    </div>

    <details>
      <summary data-i18n="sshkey_reveal">秘密鍵を表示する</summary>
      <pre id="private"></pre>
      <div class="row">
        <button id="copy-private" data-i18n="sshkey_copy_private">秘密鍵をコピー</button>
      </div>
    </details>

    <p class="warn" data-i18n="sshkey_warning">秘密鍵は誰にも渡さないでください。ホストに貼り付けるのは公開鍵（ssh- で始まる 1 行）です。</p>
  </section>

  <div id="status"></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const S = window.__conduitStrings || {};
const t = (key, fallback) => S[key] || fallback;
const status_ = (msg, isError) => {
  const el = $("status");
  el.textContent = msg;
  el.className = isError ? "error" : "";
};

// The launcher's IPC. The key itself is made in Rust: a webview would have
// to hand-roll the OpenSSH private key container, and that is the last
// thing worth hand-rolling.
const IPC = window.__TAURI_INTERNALS__;
const invoke = (cmd, args) =>
  IPC ? IPC.invoke(cmd, args || {}) : Promise.reject(new Error(t("sshkey_no_ipc", "conduit の中から開いてください")));

let current = null;



const selectedKind = () => document.querySelector('input[name="kind"]:checked').value;

function showRsaNote() {
  $("rsa-note").style.display = selectedKind() === "rsa" ? "" : "none";
}

$("generate").onclick = () => {
  $("generate").disabled = true;
  status_(t("sshkey_generating", "生成しています…"));
  invoke("generate_ssh_key", {
    kind: selectedKind(),
    comment: $("comment").value,
    passphrase: $("passphrase").value,
  })
    .then((pair) => {
      current = pair;
      $("public").textContent = pair.public;
      $("private").textContent = pair.private;
      $("fingerprint").textContent = pair.fingerprint + "  (" + pair.algorithm + ")";
      $("result").classList.remove("hidden");
      // Re-folded on every generation: the previous key's private half
      // must not stay on screen because it was opened once.
      $("result").querySelector("details").open = false;
      status_(t("sshkey_done", "生成しました。まだ保存されていません"));
    })
    .catch((e) => status_(String(e && e.message ? e.message : e), true))
    .finally(() => {
      $("generate").disabled = false;
    });
};

$("save").onclick = () => {
  if (!current) return;
  // The dialog lives on the Rust side; a tool window is not granted the
  // dialog plugin, and this way the file is written with the right
  // permissions in the same step.
  invoke("save_ssh_key_dialog", {
    suggestedName: current.suggested_name,
    public: current.public,
    private: current.private,
  })
    .then((path) => {
      if (!path) {
        status_(t("sshkey_save_cancelled", "保存を中止しました"));
        return;
      }
      status_(t("sshkey_saved", "保存しました") + ": " + path);
    })
    .catch((e) => status_(String(e && e.message ? e.message : e), true));
};

$("copy-public").onclick = () => current && copy(current.public);
$("copy-private").onclick = () => current && copy(current.private);

// navigator.clipboard needs a secure context, which a custom-protocol
// origin may not be — fall back to execCommand
function copy(text) {
  const done = () => status_(t("copied", "コピーしました"));
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(done).catch(() => copyFallback(text, done));
  } else {
    copyFallback(text, done);
  }
}
function copyFallback(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand("copy");
  ta.remove();
  done();
}

for (const radio of document.querySelectorAll('input[name="kind"]')) {
  radio.addEventListener("change", showRsaNote);
}
showRsaNote();
if (!IPC) {
  $("generate").disabled = true;
  status_(t("sshkey_no_ipc", "conduit の中から開いてください"), true);
}
</script>
</body>
</html>
